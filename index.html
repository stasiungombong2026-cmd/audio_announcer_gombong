<!-- Bagian JavaScript yang diperbarui untuk penanganan pelafalan, variabel, dan multi-bahasa -->
<script>
  // Konversi teks angka/nomor agar dibaca digit per digit (contoh: 207 -> dua nol tujuh)
  function spellOutTrainNumber(trainNo) {
    if (!trainNo) return '';
    const digitWords = {'0':'nol', '1':'satu', '2':'dua', '3':'tiga', '4':'empat', '5':'lima', '6':'enam', '7':'tujuh', '8':'delapan', '9':'sembilan'};
    return trainNo.toString().toUpperCase().split('').map(char => digitWords[char] || char).join(' ');
  }

  // Konversi waktu (HH:MM WIB) agar dibaca natural (contoh: 22:15 -> dua puluh dua lewat lima belas menit waktu indonesia bagian barat)
  function spellOutTime(timeStr) {
    if (!timeStr) return '';
    const parts = timeStr.split(':');
    if (parts.length < 2) return timeStr;
    const hour = parseInt(parts[0], 10);
    const minute = parseInt(parts[1], 10);
    
    // Konversi angka jam dan menit sederhana ke kata-kata bahasa Indonesia
    const numberToWords = (n) => {
      const words = ["nol","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas","dua belas","tiga belas","empat belas","lima belas","enam belas","tujuh belas","delapan belas","sembilan belas","dua puluh","dua puluh satu","dua puluh dua","dua puluh tiga","dua puluh empat","dua puluh lima","dua puluh enam","dua puluh tujuh","dua puluh delapan","dua puluh sembilan","tiga puluh","tiga puluh satu","tiga puluh dua","tiga puluh tiga","tiga puluh empat","tiga puluh lima","tiga puluh enam","tiga puluh tujuh","tiga puluh delapan","tiga puluh sembilan","empat puluh","empat puluh satu","empat puluh dua","empat puluh tiga","empat puluh empat","empat puluh lima","empat puluh enam","empat puluh tujuh","empat puluh delapan","empat puluh sembilan","lima puluh","lima puluh satu","lima puluh dua","lima puluh tiga","lima puluh empat","lima puluh lima","lima puluh enam","lima puluh tujuh","lima puluh delapan","lima puluh sembilan"];
      return words[n] || n;
    };

    let result = numberToWords(hour) + " lewat ";
    if (minute === 0) {
      result = numberToWords(hour) + " tepat";
    } else {
      result += numberToWords(minute) + " menit";
    }
    return result + " waktu indonesia bagian barat";
  }

  // Daftar Kereta & Stasiun Tujuan Akhir (Diambil stasiun tujuannya saja, misal: "Bandung")
  const daftarKereta = [
    { nomor_kereta: "207", nama_kereta: "Kahuripan", tujuan_akhir: "Bandung" },
    { nomor_kereta: "1009A", nama_kereta: "Logawa", tujuan_akhir: "Purwokerto" }
  ];

  // Template Pengumuman dalam 3 Bahasa dengan Logat/Gaya Natural Petugas Stasiun
  const templatePengumuman = {
    indonesia: (data) => `Perhatian kepada seluruh penumpang, Kereta Api ${data.nama_kereta} dengan nomor ${spellOutTrainNumber(data.nomor_kereta)}, tujuan akhir ${data.tujuan_akhir}, yang diberangkatkan pada pukul ${spellOutTime(data.waktu)}, dipersilakan naik melalui peron jalur ${data.jalur}.`,
    
    inggris: (data) => `Attention to all passengers, Train ${data.nama_kereta} with number ${spellOutTrainNumber(data.nomor_kereta)}, with final destination ${data.tujuan_akhir}, departing at ${data.waktu}, please board from platform track ${data.jalur}.`,
    
    jawa: (data) => `Kawigatosan dhumateng sedaya para penumpang, Sepur ${data.nama_kereta} nomor ${spellOutTrainNumber(data.nomor_kereta)}, tujuwan pungkasan ${data.tujuan_akhir}, ingkang badhe berangkat tabuh ${data.waktu}, dipunaturan munggah liwat peron jalur ${data.jalur}.`
  };

  // Fungsi untuk memutar Web Speech API dengan intonasi petugas (mengatur pitch dan rate agar stabil)
  function putarPengumuman(teks, bahasa) {
    const utterance = new SpeechSynthesisUtterance(teks);
    utterance.lang = bahasa === 'inggris' ? 'en-US' : (bahasa === 'jawa' ? 'jv-ID' : 'id-ID');
    utterance.rate = 0.90; // Kecepatan sedikit lambat ala pengumuman stasiun profesional
    utterance.pitch = 1.0;  // Nada stabil dan tegas
    window.speechSynthesis.speak(utterance);
  }
</script>
