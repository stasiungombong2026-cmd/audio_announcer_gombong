        // Inisialisasi Elemen HTML
        const categorySelect = document.getElementById('categorySelect');
        const templateSelect = document.getElementById('templateSelect');
        const trainSelect = document.getElementById('trainSelect');
        const announcementText = document.getElementById('announcementText');
        const narratorSelect = document.getElementById('narratorSelect');
        const chimeSelect = document.getElementById('chimeSelect');
        const totalTrains = document.getElementById('totalTrains');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        // Render Data Awal
        function initApp() {
            totalTrains.textContent = appData.trains.length;

            // Kategori Unik
            const categories = [...new Set(appData.templates.map(t => t.cat))];
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat.toUpperCase();
                categorySelect.appendChild(opt);
            });

            // Daftar Kereta
            appData.trains.forEach(train => {
                const opt = document.createElement('option');
                opt.value = JSON.stringify(train);
                opt.textContent = `KA ${train.name} (${train.no}) - ${train.route}`;
                trainSelect.appendChild(opt);
            });

            // Narator
            appData.narrators.forEach(nar => {
                const opt = document.createElement('option');
                opt.value = nar.id;
                opt.textContent = nar.name;
                narratorSelect.appendChild(opt);
            });

            // Chime
            appData.chimes.forEach(chime => {
                const opt = document.createElement('option');
                opt.value = chime.id;
                opt.textContent = chime.name;
                chimeSelect.appendChild(opt);
            });
        }

        // Filter Templat Berdasarkan Kategori
        categorySelect.addEventListener('change', () => {
            const selectedCat = categorySelect.value;
            templateSelect.innerHTML = '<option value="">-- Pilih Templat --</option>';
            
            const filtered = appData.templates.filter(t => t.cat === selectedCat);
            filtered.forEach((t, index) => {
                const opt = document.createElement('option');
                opt.value = JSON.stringify(t);
                opt.textContent = t.title;
                templateSelect.appendChild(opt);
            });
        });

        // Update Teks Pengumuman Otomatis
        function updateTextPreview() {
            let text = "";
            if (templateSelect.value) {
                const template = JSON.parse(templateSelect.value);
                text = template.text;

                if (trainSelect.value) {
                    const train = JSON.parse(trainSelect.value);
                    text = text
                        .replace(/{train_name}/g, train.name)
                        .replace(/{train_no}/g, train.no)
                        .replace(/{train_route}/g, train.route)
                        .replace(/{platform}/g, train.platform)
                        .replace(/{direction}/g, train.direction);
                }
            }
            announcementText.value = text;
        }

        templateSelect.addEventListener('change', updateTextPreview);
        trainSelect.addEventListener('change', updateTextPreview);

        // Simulasi Audio Chime & Speech Synthesis Web API
        function playChime(callback) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // Nada Chime KAI sederhana (Melodi 4 nada)
                const notes = [523.25, 659.25, 783.99, 1046.50]; 
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + index * 0.2 + 0.6);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + index * 0.2);
                    osc.stop(audioCtx.currentTime + index * 0.2 + 0.6);
                });

                setTimeout(callback, notes.length * 200 + 300);
            } catch (e) {
                callback();
            }
        }

        playBtn.addEventListener('click', () => {
            const textToSpeak = announcementText.value;
            if (!textToSpeak) return alert("Silakan pilih templat atau masukkan teks pengumuman terlebih dahulu.");

            window.speechSynthesis.cancel(); // Hentikan suara sebelumnya

            playChime(() => {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'id-ID';
                utterance.rate = 0.95; // Kecepatan mirip pengumuman stasiun

                // Pilih suara browser jika tersedia
                const voices = window.speechSynthesis.getVoices();
                const indonesianVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
                if (indonesianVoice) utterance.voice = indonesianVoice;

                window.speechSynthesis.speak(utterance);
            });
        });

        stopBtn.addEventListener('click', () => {
            window.speechSynthesis.cancel();
        });

        // Jalankan Inisialisasi
        initApp();
    </script>
