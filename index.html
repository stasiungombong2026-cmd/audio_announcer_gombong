<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Announcement Stasiun Gombong</title>
    <!-- Tailwind CSS untuk Desain Modern & Responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white shadow-xl rounded-2xl p-6 md:p-8">
        <!-- Header & Pemilih Bahasa -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 id="app-title" class="text-xl font-bold text-slate-900">Audio Announcement Stasiun Gombong</h1>
                <p id="app-subtitle" class="text-xs text-slate-500">DAOP 5 Purwokerto</p>
            </div>
            <div>
                <select id="languageSelect" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English</option>
                    <option value="jv">Basa Jawa</option>
                </select>
            </div>
        </div>

        <!-- Panel Kontrol Utama -->
        <div class="space-y-4">
            <!-- Pilihan Kereta -->
            <div>
                <label id="label-train" class="block text-sm font-medium text-slate-700 mb-1">Pilih Kereta Api</label>
                <select id="trainSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm">
                    <option value="Logawa">KA Logawa (Purwokerto - Jember)</option>
                    <option value="Kertanegara">KA Kertanegara (Purwokerto - Malang)</option>
                    <option value="Gaya Baru Malam Selatan">KA Gaya Baru Malam Selatan (Pasar Senen - Surabaya Gubeng)</option>
                </select>
            </div>

            <!-- Pilihan Jalur -->
            <div>
                <label id="label-track" class="block text-sm font-medium text-slate-700 mb-1">Jalur / Peron</label>
                <select id="trackSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm">
                    <option value="1">Jalur 1 (Satu)</option>
                    <option value="2">Jalur 2 (Dua)</option>
                </select>
            </div>

            <!-- Pratinjau Teks Baku (Dinamis) -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                <span id="label-preview" class="text-xs font-semibold text-blue-600 uppercase tracking-wider block mb-1">Pratinjau Pengumuman</span>
                <p id="previewText" class="text-sm text-blue-900 italic leading-relaxed">-- Memuat teks... --</p>
            </div>

            <!-- Tombol Aksi -->
            <button id="btn-play" onclick="playAnnouncement()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md">
                Putar Pengumuman
            </button>
        </div>

        <!-- Status Bar -->
        <div class="mt-6 text-center">
            <span id="status-bar" class="text-xs text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Sistem Siap</span>
        </div>
    </div>

    <!-- Script Logika Aplikasi & Konversi Teks Baku -->
    <script>
        // Kamus Data Teks Baku Multi-Bahasa
        const translations = {
            id: {
                appTitle: "Audio Announcement Stasiun Gombong",
                subtitle: "DAOP 5 Purwokerto",
                labelTrain: "Pilih Kereta Api",
                labelTrack: "Jalur / Peron",
                labelPreview: "Pratinjau Pengumuman",
                btnPlay: "Putar Pengumuman",
                statusReady: "Sistem Siap",
                statusPlaying: "Memutar pengumuman...",
                template: (train, track) => `Perhatian, perhatian. Kereta api ${train} akan segera tiba di jalur ${track} Stasiun Gombong. Penumpang dipersilakan bersiap di peron.`
            },
            en: {
                appTitle: "Gombong Station Audio Announcement",
                subtitle: "DAOP 5 Purwokerto",
                labelTrain: "Select Train",
                labelTrack: "Platform",
                labelPreview: "Announcement Preview",
                btnPlay: "Play Announcement",
                statusReady: "System Ready",
                statusPlaying: "Playing announcement...",
                template: (train, track) => `Attention please. Train ${train} is approaching platform ${track} at Gombong Station. Passengers, please prepare yourselves at the platform.`
            },
            jv: {
                appTitle: "Audio Pengumuman Stasiun Gombong",
                subtitle: "DAOP 5 Purwokerto",
                labelTrain: "Pilih Sepur",
                labelTrack: "Jalur / Peron",
                labelPreview: "Teks Pengumuman",
                btnPlay: "Putar Pengumuman",
                statusReady: "Sistem Siap",
                statusPlaying: "Muter pengumuman...",
                template: (train, track) => `Kawigatosan, kawigatosan. Sepur ${train} badhe segera rawuh ing jalur ${track} Stasiun Gombong. Para penumpang dipun suwun siyap-siyap ing peron.`
            }
        };

        // Fungsi Memperbarui Teks Baku Secara Otomatis
        function updateUI() {
            const lang = document.getElementById('languageSelect').value;
            const train = document.getElementById('trainSelect').value;
            const track = document.getElementById('trackSelect').value;
            const dict = translations[lang];

            // Ubah elemen statis
            document.getElementById('app-title').innerText = dict.appTitle;
            document.getElementById('app-subtitle').innerText = dict.subtitle;
            document.getElementById('label-train').innerText = dict.labelTrain;
            document.getElementById('label-track').innerText = dict.labelTrack;
            document.getElementById('label-preview').innerText = dict.labelPreview;
            document.getElementById('btn-play').innerText = dict.btnPlay;
            document.getElementById('status-bar').innerText = dict.statusReady;

            // Perbarui pratinjau teks baku dinamis dengan variabel
            document.getElementById('previewText').innerText = dict.template(train, track);

            // Simpan preferensi bahasa ke localStorage
            localStorage.setItem('selectedLang', lang);
        }

        // Simulasi Aksi Putar Audio
        function playAnnouncement() {
            const lang = document.getElementById('languageSelect').value;
            const dict = translations[lang];
            const statusBar = document.getElementById('status-bar');

            statusBar.innerText = dict.statusPlaying;
            statusBar.className = "text-xs text-amber-600 bg-amber-50 px-3 py-1 rounded-full font-medium";

            // Gunakan Web Speech API bawaan browser untuk simulasi suara
            const textToSpeech = document.getElementById('previewText').innerText;
            const speech = new SpeechSynthesisUtterance(textToSpeech);
            
            // Konfigurasi bahasa browser berdasarkan pilihan
            if (lang === 'en') speech.lang = 'en-US';
            else if (lang === 'jv') speech.lang = 'id-ID'; // Fallback umum untuk mesin suara
            else speech.lang = 'id-ID';

            window.speechSynthesis.speak(speech);

            speech.onend = function() {
                statusBar.innerText = dict.statusReady;
                statusBar.className = "text-xs text-slate-400 bg-slate-100 px-3 py-1 rounded-full";
            };
        }

        // Event Listeners untuk mendeteksi perubahan secara real-time
        document.getElementById('languageSelect').addEventListener('change', updateUI);
        document.getElementById('trainSelect').addEventListener('change', updateUI);
        document.getElementById('trackSelect').addEventListener('change', updateUI);

        // Inisialisasi awal saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selectedLang') || 'id';
            document.getElementById('languageSelect').value = savedLang;
            updateUI();
        });
    </script>
</body>
</html>
