<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kereta - Stasiun Gombong</title>
  <!-- Anda boleh sertakan CSS Bootstrap di sini jika perlukan penggayaan -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    .modal-dialog {
      margin-top: 50px;
    }
    .modal-content {
      background-color: #1c2541;
      border: 1px solid #3a506b;
      color: #ffffff;
      border-radius: 8px;
    }
    .form-control {
      background-color: #0b132b;
      border: 1px solid #3a506b;
      color: #ffffff;
    }
    .form-control:focus {
      background-color: #0b132b;
      color: #ffffff;
      border-color: #5bc0be;
      box-shadow: none;
    }
    .btn-warning {
      background-color: #f39c12;
      border-color: #f39c12;
      color: #ffffff;
    }
    .btn-warning:hover {
      background-color: #d68910;
      border-color: #d68910;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">EDIT KERETA</h5>
          <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- Nomor KA -->
          <div class="form-group">
            <label for="nomorKA">Nomor KA</label>
            <input type="text" id="nomorKA" class="form-control" value="67">
          </div>

          <!-- Nama Kereta -->
          <div class="form-group">
            <label for="namaKereta">Nama Kereta</label>
            <input type="text" id="namaKereta" class="form-control" value="Malabar">
          </div>

          <!-- Tujuan Akhir -->
          <div class="form-group">
            <label for="tujuanAkhir">Tujuan Akhir</label>
            <input type="text" id="tujuanAkhir" class="form-control" value="Bandung">
          </div>

          <!-- Pilih Jalur & Arah -->
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="pilihJalur">Pilih Jalur</label>
              <select id="pilihJalur" class="form-control">
                <option value="Jalur 1" selected>Jalur 1</option>
                <option value="Jalur 2">Jalur 2</option>
                <option value="Jalur 3">Jalur 3</option>
              </select>
            </div>
            <div class="form-group col-md-6">
              <label for="pilihArah">Pilih Arah</label>
              <select id="pilihArah" class="form-control">
                <option value="Barat" selected>Barat</option>
                <option value="Timur">Timur</option>
              </select>
            </div>
          </div>

          <!-- SF Rangkaian dengan Pembolehubah Pilihan -->
          <div class="form-group">
            <label for="sfRangkaian">SF Rangkaian (Susunan Rangkaian)</label>
            <select id="sfRangkaian" class="form-control">
              <option value="">-- Pilih Variabel Rangkaian --</option>
              <option value="lokomotif">Lokomotif</option>
              <option value="ekonomi">Ekonomi</option>
              <option value="bisnis">Bisnis</option>
              <option value="premium">Premium</option>
              <option value="eksekutif">Eksekutif</option>
              <option value="priority">Priority</option>
              <option value="kereta_makan">Kereta Makan</option>
              <option value="kereta_pembangkit">Kereta Pembangkit</option>
            </select>
          </div>

          <!-- Stasiun Perhentian -->
          <div class="form-group">
            <label for="stasiunPerhentian">Stasiun Perhentian</label>
            <input type="text" id="stasiunPerhentian" class="form-control" value="Kroya, Kebumen, Kutoarjo">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-warning">Simpan Kereta</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
