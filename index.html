<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stasiun Gombong - Sistem Audio Announcement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1329; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col justify-between">
    <div class="max-w-6xl mx-auto space-y-6 w-full">
        
        <!-- Header -->
        <header class="bg-[#101935] border border-[#1e2d5c] rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-train"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">STASIUN KELAS 1 GOMBONG</h1>
                    <p class="text-xs text-slate-400 font-medium">DAOP 5 PURWOKERTO - Panel Kontrol Audio Otomatis</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="switchTab('generator')" id="btn-gen" class="px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 transition shadow">Generator</button>
                <button onclick="switchTab('kereta')" id="btn-kereta" class="px-4 py-2 rounded-xl text-xs font-semibold bg-[#141e3d] text-slate-300 border border-[#1e2d5c] transition">Daftar Kereta</button>
                <button onclick="switchTab('teks')" id="btn-teks" class="px-4 py-2 rounded-xl text-xs font-semibold bg-[#141e3d] text-slate-300 border border-[#1e2d5c] transition">Teks Baku</button>
            </div>
        </header>

        <!-- TAB 1: GENERATOR -->
        <div id="tab-generator" class="space-y-4">
            <div class="bg-[#101935] border border-[#1e2d5c] rounded-2xl p-6 shadow-xl space-y-4">
                <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wide"><i class="fa-solid fa-bullhorn mr-2"></i> Generator Pengumuman Suara</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Pilih Kereta</label>
                        <select id="gen-kereta" onchange="updateScriptTemplate()" class="w-full bg-[#0b1329] border border-[#1e2d5c] rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                            <!-- Diisi via script -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Jalur Penempatan</label>
                        <select id="gen-jalur" onchange="updateScriptTemplate()" class="w-full bg-[#0b1329] border border-[#1e2d5c] rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                            <option value="Jalur 1 (Timur)">Jalur 1 (Timur)</option>
                            <option value="Jalur 2 (Barat)" selected>Jalur 2 (Barat)</option>
                            <option value="Jalur 3 (Barat)">Jalur 3 (Barat)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Skrip Pengumuman</label>
                    <textarea id="gen-text" rows="4" class="w-full bg-[#070b19] border border-[#1e2d5c] rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <button onclick="playSpeech()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> Putar Suara Pengumuman
                </button>
            </div>
        </div>

        <!-- TAB 2: DAFTAR KERETA -->
        <div id="tab-kereta" class="hidden space-y-4">
            <div class="bg-[#101935] border border-[#1e2d5c] rounded-2xl p-6 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-[#1e2d5c] pb-3">
                    <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wide"><i class="fa-solid fa-train-subway mr-2"></i> Daftar Kereta & Jadwal Stasiun Gombong</h2>
                    <button onclick="addTrainPrompt()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-md">+ Tambah Kereta</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-[#070b19] text-slate-400 border-b border-[#1e2d5c] uppercase">
                            <tr>
                                <th class="p-3">No. KA</th>
                                <th class="p-3">Nama Kereta</th>
                                <th class="p-3">Tujuan Akhir</th>
                                <th class="p-3">Jalur</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-kereta-body" class="divide-y divide-[#1e2d5c]">
                            <!-- Render otomatis -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: TEKS BAKU -->
        <div id="tab-teks" class="hidden space-y-4">
            <div class="bg-[#101935] border border-[#1e2d5c] rounded-2xl p-6 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-[#1e2d5c] pb-3">
                    <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wide"><i class="fa-solid fa-file-lines mr-2"></i> Manajemen Teks Baku</h2>
                    <button onclick="addTeksPrompt()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-md">+ Tambah Teks</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-[#070b19] text-slate-400 border-b border-[#1e2d5c] uppercase">
                            <tr>
                                <th class="p-3">Kategori</th>
                                <th class="p-3">Judul Template</th>
                                <th class="p-3">Isi Skrip</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-teks-body" class="divide-y divide-[#1e2d5c]">
                            <!-- Render otomatis -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500 py-4 border-t border-[#1e2d5c]">
        Stasiun Gombong (GBG) &bull; Daop 5 Purwokerto &copy; 2026
    </footer>

    <!-- Skrip Aplikasi Penuh -->
    <script>
        let trainsData = JSON.parse(localStorage.getItem('gh_trains')) || [
            { no: "142A", name: "Sawunggalih", route: "Pasar Senen", track: "Jalur 2 (Barat)" },
            { no: "67", name: "Malabar", route: "Bandung", track: "Jalur 1 (Timur)" },
            { no: "112", name: "Brantas", route: "Pasar Senen", track: "Jalur 2 (Barat)" },
            { no: "154", name: "Singasari", route: "Blitar", track: "Jalur 1 (Timur)" },
            { no: "185", name: "Kertanegara", route: "Malang", track: "Jalur 1 (Timur)" },
            { no: "220", name: "Logawa", route: "Jember", track: "Jalur 2 (Barat)" },
            { no: "256", name: "Kutojaya Selatan", route: "Kiaracondong", track: "Jalur 2 (Barat)" },
            { no: "305", name: "Progo", route: "Pasar Senen", track: "Jalur 2 (Barat)" }
        ];

        let teksData = JSON.parse(localStorage.getItem('gh_teks')) || [
            { kat: "Kedatangan", judul: "Kedatangan Standar", isi: "Perhatian kepada seluruh penumpang, KA {nama_ka} tujuan {tujuan} sesaat lagi akan tiba di {jalur}, Stasiun Gombong." },
            { kat: "Keberangkatan", judul: "Keberangkatan Standar", isi: "Pengumuman untuk penumpang KA {nama_ka} tujuan {tujuan} dipersilakan segera naik ke rangkaian kereta melalui {jalur}." },
            { kat: "Keselamatan", judul: "Peringatan Peron", isi: "Dihimbau kepada seluruh pengunjung dan penumpang untuk selalu berhati-hati dan menjaga jarak aman di garis kuning peron stasiun." }
        ];

        function saveStorage() {
            localStorage.setItem('gh_trains', JSON.stringify(trainsData));
            localStorage.setItem('gh_teks', JSON.stringify(teksData));
        }

        function populateDropdown() {
            const select = document.getElementById('gen-kereta');
            if(!select) return;
            select.innerHTML = '';
            trainsData.forEach(item => {
                select.innerHTML += `<option value="KA ${item.name} (${item.no}) Tujuan ${item.route}">${item.no} - ${item.name} (${item.route})</option>`;
            });
            updateScriptTemplate();
        }

        function updateScriptTemplate() {
            const kereta = document.getElementById('gen-kereta').value;
            const jalur = document.getElementById('gen-jalur').value;
            const textarea = document.getElementById('gen-text');
            if(textarea) {
                textarea.value = `Perhatian kepada seluruh penumpang, ${kereta} sesaat lagi akan tiba di ${jalur}, Stasiun Gombong. Penumpang dipersiapkan diri dengan baik.`;
            }
        }

        function renderTrains() {
            const tbody = document.getElementById('table-kereta-body');
            if(!tbody) return;
            tbody.innerHTML = '';
            trainsData.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-[#141e3d]/40 transition">
                        <td class="p-3 font-mono font-bold text-amber-400">${item.no}</td>
                        <td class="p-3 font-semibold text-white">${item.name}</td>
                        <td class="p-3">${item.route}</td>
                        <td class="p-3 font-mono text-slate-400">${item.track}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTrain(${index})" class="bg-[#141e3d] hover:bg-rose-900/50 text-rose-400 px-3 py-1 rounded-lg border border-[#1e2d5c] transition">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function renderTeks() {
            const tbody = document.getElementById('table-teks-body');
            if(!tbody) return;
            tbody.innerHTML = '';
            teksData.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-[#141e3d]/40 transition">
                        <td class="p-3"><span class="bg-[#0b1329] border border-[#1e2d5c] text-amber-400 px-2.5 py-1 rounded-md text-[10px] font-mono">${item.kat}</span></td>
                        <td class="p-3 font-semibold text-white">${item.judul}</td>
                        <td class="p-3 font-mono text-slate-300 text-[11px]">${item.isi}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTeks(${index})" class="bg-[#141e3d] hover:bg-rose-900/50 text-rose-400 px-3 py-1 rounded-lg border border-[#1e2d5c] transition">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function switchTab(tabName) {
            document.getElementById('tab-generator').classList.add('hidden');
            document.getElementById('tab-kereta').classList.add('hidden');
            document.getElementById('tab-teks').classList.add('hidden');

            document.getElementById('btn-gen').className = "px-4 py-2 rounded-xl text-xs font-semibold bg-[#141e3d] text-slate-300 border border-[#1e2d5c] transition";
            document.getElementById('btn-kereta').className = "px-4 py-2 rounded-xl text-xs font-semibold bg-[#141e3d] text-slate-300 border border-[#1e2d5c] transition";
            document.getElementById('btn-teks').className = "px-4 py-2 rounded-xl text-xs font-semibold bg-[#141e3d] text-slate-300 border border-[#1e2d5c] transition";

            if(tabName === 'generator') {
                document.getElementById('tab-generator').classList.remove('hidden');
                document.getElementById('btn-gen').className = "px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 transition shadow";
            } else if(tabName === 'kereta') {
                document.getElementById('tab-kereta').classList.remove('hidden');
                document.getElementById('btn-kereta').className = "px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 transition shadow";
                renderTrains();
            } else if(tabName === 'teks') {
                document.getElementById('tab-teks').classList.remove('hidden');
                document.getElementById('btn-teks').className = "px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 transition shadow";
                renderTeks();
            }
        }

        function addTrainPrompt() {
            let no = prompt("Masukkan Nomor Kereta (contoh: 220):");
            let name = prompt("Masukkan Nama Kereta (contoh: Logawa):");
            let route = prompt("Masukkan Tujuan Akhir (contoh: Jember):");
            if(no && name) {
                trainsData.push({ no, name, route, track: "Jalur 2 (Barat)" });
                saveStorage();
                populateDropdown();
                renderTrains();
            }
        }

        function deleteTrain(index) {
            trainsData.splice(index, 1);
            saveStorage();
            populateDropdown();
            renderTrains();
        }

        function addTeksPrompt() {
            let judul = prompt("Masukkan Judul Template:");
            let isi = prompt("Masukkan Isi Skrip Pengumuman:");
            if(judul && isi) {
                teksData.push({ kat: "Umum", judul, isi });
                saveStorage();
                renderTeks();
            }
        }

        function deleteTeks(index) {
            teksData.splice(index, 1);
            saveStorage();
            renderTeks();
        }

        function playSpeech() {
            const text = document.getElementById('gen-text').value;
            if(!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }

        window.onload = function() {
            populateDropdown();
            renderTrains();
            renderTeks();
        };
    </script>
</body>
</html>
