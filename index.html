<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Announcement Stasiun Gombong - Daop 5 Purwokerto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-center">
            <span class="bg-blue-500/30 text-blue-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">DAOP 5 PURWOKERTO</span>
            <h1 class="text-2xl font-bold mt-2 text-white">Stasiun Kelas 1 Gombong</h1>
            <p class="text-blue-100 text-sm mt-1">Sistem Pengumuman Informasi Kereta Api</p>
        </div>

        <!-- Konten Utama -->
        <div class="p-6 space-y-6">
            <!-- Pilihan Bahasa -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Pilih Bahasa / Multi-Language</label>
                <select id="langSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-blue-500">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English (Inggris)</option>
                    <option value="jv">Basa Jawa (Ngasar)</option>
                </select>
            </div>

            <!-- Pilihan Jenis Pengumuman & Teks Baku -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Jenis Pengumuman (Teks Baku)</label>
                <select id="announcementType" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-blue-500" onchange="updateDefaultText()">
                    <option value="boarding">Panggilan Naik (Boarding)</option>
                    <option value="arrival">Kereta Segera Datang (Arrival)</option>
                    <option value="delayed">Keterlambatan (Delay)</option>
                    <option value="departure">Kereta Akan Berangkat (Departure)</option>
                </select>
            </div>

            <!-- Pilihan Kereta (Variabel Daftar Kereta) -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Pilih Kereta Api</label>
                <select id="trainSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-blue-500">
                    <optgroup label="KA Eksekutif & Campuran">
                        <option value="KA Kutojaya Utara">KA Kutojaya Utara (Kroya - Pasar Senen)</option>
                        <option value="KA Sawunggalih">KA Sawunggalih (Kutoarjo - Pasar Senen)</option>
                        <option value="KA Serayu">KA Serayu (Purwokerto - Pasar Senen via Bandung)</option>
                        <option value="KA Bogowonto">KA Bogowonto (Lempuyangan - Pasar Senen)</option>
                        <option value="KA Progo">KA Progo (Lempuyangan - Pasar Senen)</option>
                    </optgroup>
                    <optgroup label="KA Komersial Unggulan">
                        <option value="KA Argo Dwipangga">KA Argo Dwipangga (Solo Balapan - Gambir)</option>
                        <option value="KA Argo Lawu">KA Argo Lawu (Solo Balapan - Gambir)</option>
                        <option value="KA Taksaka">KA Taksaka (Yogyakarta - Gambir)</option>
                        <option value="KA Gajayana">KA Gajayana (Malang - Gambir)</option>
                    </optgroup>
                </select>
            </div>

            <!-- Nomor Jalur / Peron -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Jalur / Peron</label>
                <select id="trackSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-blue-500">
                    <option value="Jalur 1">Jalur 1</option>
                    <option value="Jalur 2">Jalur 2</option>
                    <option value="Jalur 3">Jalur 3</option>
                </select>
            </div>

            <!-- Preview Teks Otomatis -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Naskah Pengumuman (Text Preview)</label>
                <textarea id="scriptPreview" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-300 text-sm focus:outline-none" readonly></textarea>
            </div>

            <!-- Tombol Aksi -->
            <div class="flex gap-4 pt-2">
                <button onclick="playAnnouncement()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.26a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Putar Pengumuman (TTS)
                </button>
                <button onclick="stopAnnouncement()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-700/50 font-semibold py-3 px-4 rounded-xl transition">
                    Berhenti
                </button>
            </div>
        </div>
        
        <div class="bg-slate-900/50 p-4 text-center text-xs text-slate-500 border-t border-slate-800">
            &copy; 2026 Stasiun Gombong - Daop 5 Purwokerto. All rights reserved.
        </div>
    </div>

    <script>
        const templates = {
            id: {
                boarding: (train, track) => `Perhatian kepada seluruh penumpang, ${train}, yang akan diberangkatkan menuju tujuan akhir, dipersilakan naik melalui ${track}. Selamat jalan dan terima kasih.`,
                arrival: (train, track) => `Perhatian, ${train} sebentar lagi akan tiba di Stasiun Gombong melalui ${track}. Kepada para penumpang yang ingin naik dipersilakan bersiap di peron.`,
                delayed: (train) => `Mohon perhatian, perjalanan ${train} mengalami keterlambatan dari jadwal semula. Kami mohon maaf atas ketidaknyamanan ini.`,
                departure: (train, track) => `${train} sesaat lagi akan diberangkatkan dari ${track}. Pintu kereta akan segera ditutup.`
            },
            en: {
                boarding: (train, track) => `Attention all passengers, ${train}, bound for its final destination, is now ready for boarding at ${track}. Have a safe journey and thank you.`,
                arrival: (train, track) => `Attention, ${train} will shortly arrive at Gombong Station on ${track}. Passengers intending to board, please prepare at the platform.`,
                delayed: (train) => `Your attention please, the journey of ${train} is experiencing a delay from its schedule. We apologize for the inconvenience.`,
                departure: (train, track) => `${train} is about to depart from ${track}. The doors will be closed shortly.`
            },
            jv: {
                boarding: (train, track) => `Para rawuh sedaya, sesarengan lampahing ${train}, ingkang badhe mangkat nuju tujuwan pungkasan, dipunaturan minggah saking ${track}. Matur nuwun.`,
                arrival: (train, track) => `Kawigatosan, ${train} sekedap malih badhe dumugi ing Stasiun Gombong liwat ${track}. Kanggo para penumpang dipunaturan siaga ing peron.`,
                delayed: (train) => `Nuwun sewu, lampahing ${train} ngalami kalambatan saking jadwal sakawit. Kula nyuwun agunging pangapunten.`,
                departure: (train, track) => `${train} sekedap malih badhe bidhal saking ${track}. Pintu gerbong badhe enggal dipunkunci.`
            }
        };

        function updateDefaultText() {
            const lang = document.getElementById('langSelect').value;
            const type = document.getElementById('announcementType').value;
            const train = document.getElementById('trainSelect').value;
            const track = document.getElementById('trackSelect').value;

            const textGen = templates[lang][type];
            document.getElementById('scriptPreview').value = textGen(train, track);
        }

        document.getElementById('langSelect').addEventListener('change', updateDefaultText);
        document.getElementById('announcementType').addEventListener('change', updateDefaultText);
        document.getElementById('trainSelect').addEventListener('change', updateDefaultText);
        document.getElementById('trackSelect').addEventListener('change', updateDefaultText);

        // Inisialisasi teks pertama kali
        window.onload = updateDefaultText;

        function playAnnouncement() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = document.getElementById('scriptPreview').value;
                const lang = document.getElementById('langSelect').value;
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'en' ? 'en-US' : (lang === 'jv' ? 'id-ID' : 'id-ID'); // fallback jv ke id jika engine TTS lokal terbatas
                utterance.rate = 0.95; // Kecepatan agak lambat ala pengumuman stasiun
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Maaf, browser Anda tidak mendukung fitur Text-to-Speech.');
            }
        }

        function stopAnnouncement() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
